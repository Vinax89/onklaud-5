[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onklaud5"
version = "4.0.0"
description = "Cross-model code review pipeline: generate, dual-review, revise, gate"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
onklaud = "council:main"

[project.urls]
Repository = "https://github.com/Vinax89/onklaud-5"

[tool.setuptools]
py-modules = ["council", "quality_gate", "ponytail_ladder", "pre_check", "fast_gate", "verify"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E722", # bare except: used deliberately for graceful degradation paths
    "E701", # compact one-line statements are house style in CLI scripts
    "E702",
    "E741", # single-letter loop vars in tight comprehensions
    "E402", # report generators import fpdf after docstring/constants
    "B007", # unused loop vars in report table iteration
]
